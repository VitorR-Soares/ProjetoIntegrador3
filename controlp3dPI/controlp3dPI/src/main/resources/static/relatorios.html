<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Home</title>
    <link rel="stylesheet" href="../css/style_barra_nav.css">
    <link rel="stylesheet" href="../css/style_relatorios.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
          <img src="../src/imgs/logo.png" alt="Logo" class="logo" />
          <ul class="menu">
            <li><a href="home.html">Home</a></li>
            <li><a href="estoque.html">Controle de Estoque</a></li>
            <li><a href="gestao_vendas.html">Gestão de Vendas</a></li>
            <li><a href="gestao_encomendas.html">Gestão Encomendas</a></li>
            <li><a href="gestao_cadastros.html">Cadastros</a></li>
            <li><a href="relatorios.html">Relatórios</a></li>
            <li><a href="gestao_compras.html">Gestão de Compras</a></li>
            <li><a href="gestao_caixa.html">Fluxo de Caixa</a></li>
          </ul>
          <button id="btn_logoff">Sair da sessão</button>
        </nav>
    
        <button class="menu-toggle" id="menuToggle">☰</button>
    
        <main class="content">
            <h2>Selecione o tipo de Relatório</h2>

            <div class="filtros-relatorio">
              <label>
                <input type="radio" name="tipo" />
                Vendas
              </label>
              <label>
                <input type="radio" name="tipo" />
                Vendedor
              </label>
          
            <div class="field">
                    <label>Funcionário:</label>
                    <select>
                        <option disabled selected>Selecione o funcionário...</option>
                    </select>
            </div>
          
            <h3>Período</h3>
            <div class="periodo">
                <div class="campo-data">
                  <label for="de">De</label>
                  <input type="date" id="de" />
                </div>
                <div class="campo-data">
                  <label for="ate">Até</label>
                  <input type="date" id="ate" />
                </div>
            </div>  

            <button class="botao-gerar">Gerar Relatório</button>

            </div>
        </main>
    </div>
    

    <script src="../js/script_geral.js"></script>
</body>
</html>
