<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Home</title>
    <link rel="stylesheet" href="../css/style_barra_nav.css">
    <link rel="stylesheet" href="../css/style_estoque.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
          <img src="../src/imgs/logo.png" alt="Logo" class="logo" />
          <ul class="menu">
            <li><a href="home.html">Home</a></li>
            <li><a href="estoque.html">Controle de Estoque</a></li>
            <li><a href="gestao_vendas.html">Gestão de Vendas</a></li>
            <li><a href="gestao_encomendas.html">Gestão Encomendas</a></li>
            <li><a href="gestao_cadastros.html">Cadastros</a></li>
            <li><a href="relatorios.html">Relatórios</a></li>
            <li><a href="gestao_compras.html">Gestão de Compras</a></li>
            <li><a href="gestao_caixa.html">Fluxo de Caixa</a></li>
          </ul>
          <button id="btn_logoff">Sair da sessão</button>
        </nav>
    
        <button class="menu-toggle" id="menuToggle">☰</button>
    
        <main class="content">
            <div class="top-bar">                
                  <input type="text" placeholder="Digite o produto que deseja" class="input-text" />
                  <select class="select">
                    <option disabled selected>Selecione uma categoria</option>
                    <option>Star Wars</option>
                    <option>Marvel</option>
                    <option>Disney</option>
                  </select>
                  <form class="add-product-form"></form>
                    <select class="select">
                        <option disabled selected>Selecione um produto...</option>
                    </select>
                    <input type="text" placeholder="Digite a quantidade" class="input-text quantity" />
                    <button type="submit" class="btn add-btn">+</button>
                </form>
            </div>
            
            <div class="table-container">
                <table class="product-table">
                  <thead>
                    <tr>
                      <th>Nome</th>
                      <th>Valor Unitário</th>
                      <th>Coleção</th>
                      <th>Alterações</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Linhas da tabela serão inseridas dinamicamente -->
                  </tbody>
                </table>
            </div>
            
            <div class="bottom-buttons">
                <button class="btn">Atualizar Estoque</button>
                <button class="btn">Remover Produto</button>
            </div>
        </main>
    </div>
    

    <script src="../js/script_geral.js"></script>
</body>
</html>
