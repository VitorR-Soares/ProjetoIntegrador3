<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Home</title>
    <link rel="stylesheet" href="../css/style_barra_nav.css">
    <link rel="stylesheet" href="../css/style_cadastro_compra.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
          <img src="../src/imgs/logo.png" alt="Logo" class="logo" />
          <ul class="menu">
            <li><a href="home.html">Home</a></li>
            <li><a href="estoque.html">Controle de Estoque</a></li>
            <li><a href="gestao_vendas.html">Gestão de Vendas</a></li>
            <li><a href="gestao_encomendas.html">Gestão Encomendas</a></li>
            <li><a href="gestao_cadastros.html">Cadastros</a></li>
            <li><a href="relatorios.html">Relatórios</a></li>
            <li><a href="gestao_compras.html">Gestão de Compras</a></li>
            <li><a href="gestao_caixa.html">Fluxo de Caixa</a></li>
          </ul>
          <button id="btn_logoff">Sair da sessão</button>
        </nav>
    
        <button class="menu-toggle" id="menuToggle">☰</button>
    
        <main class="content">
            <form class="purchase-form">
                <div class="row-form">
                  <div class="field">
                    <label>Descrição do Insumo:</label>
                    <select>
                      <option disabled selected>Selecione o produto...</option>
                    </select>
                  </div>
            
                  <div class="field">
                    <label>Quantidade:</label>
                    <input type="text" placeholder="Informe a quantidade adquirida..." />
                  </div>

                  
                </div>
            
                <div class="row-form">
                    <div class="field">
                        <label>Valor:</label>
                        <input type="text" placeholder="Informe o valor unitário..." />
                      </div>
                    <div class="field">
                        <label>Data da Compra:</label>
                        <input type="date" />
                    </div>                
                
                </div>
            
                <div class="row-form">
                  <div class="field">
                    <label>Usuário:</label>
                    <select>
                      <option disabled selected>Selecione o usuário...</option>
                    </select>
                  </div>
                </div>
                
                <div class="row-form">
                  <div class="field">
                    <label>Forma de Pagamento:</label>
                    <select>
                      <option disabled selected>Selecione a forma de pagamento...</option>
                    </select>
                  </div>
                </div>

                <div class="row-form">
                    <div class="field">
                      <label>Status:</label>
                      <select>
                        <option disabled selected>Selecione o status da compra...</option>
                        <option>Pagamento pendente</option>
                        <option>Pagamento realizado</option>
                        <option>Pedido entregue</option>
                      </select>
                    </div>
                  </div>
            
                <div class="finalizar">
                  <button type="submit" class="btn finalizar-btn">Finalizar Compra</button>
                </div>
            </form>
        </main>
    </div>
    

    <script src="../js/script_geral.js"></script>
</body>
</html>
